services:
  db:
    image: mysql:8.0-debian
    container_name: coursefree_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=64M --performance-schema=OFF --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password_123
      MYSQL_DATABASE: coursefree
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_password_123"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - coursefree_net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: coursefree_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: "mysql://root:root_secure_password_123@db:3306/coursefree"
      GOOGLE_CLIENT_ID: "335312329426-br7u9qiohc9c8a5aqu7e3k4jlrrbptr6.apps.googleusercontent.com"
      SESSION_SECRET: "coursefree_production_secret_key_change_me_2026_9f8e7d6c5b4a3"
      FRONTEND_ORIGIN: "https://khoahocfree.online,https://www.khoahocfree.online,http://khoahocfree.online,http://localhost:3000"
      COMMUNITY_SETTINGS_PATH: "/app/data/community-settings.json"
    volumes:
      - backend_data:/app/data
    networks:
      - coursefree_net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: "http://backend:5000"
        NEXT_PUBLIC_API_URL: "/api"
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "335312329426-br7u9qiohc9c8a5aqu7e3k4jlrrbptr6.apps.googleusercontent.com"
    container_name: coursefree_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      BACKEND_URL: "http://backend:5000"
      NEXT_PUBLIC_API_URL: "/api"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: "335312329426-br7u9qiohc9c8a5aqu7e3k4jlrrbptr6.apps.googleusercontent.com"
    ports:
      - "3000:3000"
    networks:
      - coursefree_net

volumes:
  mysql_data:
  backend_data:

networks:
  coursefree_net:
    driver: bridge
